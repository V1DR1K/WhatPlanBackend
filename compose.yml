name: wherefood

services:
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/v1dr1k/whatplan-frontend:latest}
    restart: unless-stopped
    networks:
      default:
      kaza_default:
        aliases:
          - whatplan-frontend
          - wherefood-frontend
    depends_on:
      backend:
        condition: service_healthy
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/v1dr1k/whatplan-backend:latest}
    restart: unless-stopped
    networks:
      default:
        aliases:
          - whatplan-backend
          - wherefood-backend
      kaza_default:
        aliases:
          - whatplan-backend
          - wherefood-backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      DATABASE_USER: ${DATABASE_RUNTIME_USER:-whatplan_runtime}
      DATABASE_PASSWORD: ${DATABASE_RUNTIME_PASSWORD:?DATABASE_RUNTIME_PASSWORD is required}
      DATABASE_ADMIN_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      DATABASE_MIGRATION_USER: ${DATABASE_MIGRATION_USER:-whatplan_migrator}
      DATABASE_MIGRATION_PASSWORD: ${DATABASE_MIGRATION_PASSWORD:?DATABASE_MIGRATION_PASSWORD is required}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:?AUTH_SERVICE_URL is required}
      AUTH_PUBLIC_KEY_PEM: ${AUTH_PUBLIC_KEY_PEM:?AUTH_PUBLIC_KEY_PEM is required}
      AUTH_PREVIOUS_PUBLIC_KEY_PEMS: ${AUTH_PREVIOUS_PUBLIC_KEY_PEMS:-}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:?AUTH_JWT_ISSUER is required}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:?AUTH_JWT_AUDIENCE is required}
      AUTH_MAX_ACCESS_TOKEN_TTL_SECONDS: ${AUTH_MAX_ACCESS_TOKEN_TTL_SECONDS:-900}
      AUTH_COOKIE_ALLOWED_ORIGINS: ${AUTH_COOKIE_ALLOWED_ORIGINS:?AUTH_COOKIE_ALLOWED_ORIGINS is required}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_REFRESH_COOKIE_TTL_SECONDS: ${AUTH_REFRESH_COOKIE_TTL_SECONDS:-604800}
      AUTH_SERVICE_CONNECT_TIMEOUT_SECONDS: ${AUTH_SERVICE_CONNECT_TIMEOUT_SECONDS:-3}
      AUTH_SERVICE_READ_TIMEOUT_SECONDS: ${AUTH_SERVICE_READ_TIMEOUT_SECONDS:-5}
      TRUSTED_PROXY_ADDRESSES: ${TRUSTED_PROXY_ADDRESSES:?TRUSTED_PROXY_ADDRESSES must contain the exact reverse-proxy IP address}
      AUTH_DEFAULT_ROLE: ${AUTH_DEFAULT_ROLE:-USER}
      TMDB_READ_ACCESS_TOKEN: ${TMDB_READ_ACCESS_TOKEN:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      IMAGE_MAX_CONCURRENT_PROCESSES: ${IMAGE_MAX_CONCURRENT_PROCESSES:-2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
    external: true
    name: wherefood_postgres_data
networks:
  kaza_default:
    external: true
